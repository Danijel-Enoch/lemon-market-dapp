# Dokploy deployment — the whole app.
#
# Eight services, and every one of them deploys. `web` alone used to be a
# complete deployment, and is not any more: since the rebuild onto vaults, every
# historical number the app shows (balances, the withdrawal queue, the activity
# feed, the share-price series) is served by the indexer and proxied by the API.
# Without it the board renders "the indexer is unreachable" and nothing else
# works.
#
#   postgres   sessions, admin allowlist, venue config, the agent's decision log
#   migrate    one-shot schema push; everything else waits on it
#   indexer    Ponder over the factory and its vaults. Internal, no ingress
#   web        the depositor app, with the API mounted in-process  → ${DOMAIN}
#   api        the same API as its own scalable unit          → ${API_DOMAIN}
#   seed       one-shot venue configuration for vaults deployed by script
#   admin      the operator console, its own origin        → ${ADMIN_DOMAIN}
#   agent      the per-vault worker. No ports, no ingress
#
# No service is behind a Compose profile. A profile does not merely stop a
# container, it stops Compose from creating one — so `api` and `agent` were
# absent from the Dokploy container list entirely, with no log to open when
# either was the thing that needed diagnosing. Anything that should not be
# running is stopped in Dokploy, where it is at least visible.
#
# Differences from `docker-compose.yml`, the local/self-hosted file:
#
#   * Nothing publishes a host port. Dokploy fronts everything with Traefik, and
#     a published port would both bypass TLS and collide with other apps on the
#     same host.
#   * Services that face the internet join the external `dokploy-network` and
#     carry the router labels that put them on a hostname.
#   * Postgres, the indexer and the agent stay on a private network with no
#     ingress at all.
#
# Set up in Dokploy:
#   1. Create an application of type "Docker Compose" pointing at this repo.
#   2. Set the compose path to `docker-compose.dokploy.yml`.
#   3. In Environment set, at minimum:
#        DOMAIN, ADMIN_DOMAIN, POSTGRES_PASSWORD, AUTH_SECRET,
#        VAULT_FACTORY_ADDRESS, VAULT_FACTORY_START_BLOCK,
#        VITE_VAULT_FACTORY_ADDRESS
#      See `.env.example` for the full list and what each one does.
#
# **The `VITE_` values are build inputs, not runtime configuration.** They are
# compiled into the browser bundle, so changing one requires a rebuild rather
# than a restart, and one image serves one chain. That is why they appear under
# `build.args` and not under `environment`.
#
# `dokploy-network` is created by Dokploy on install. It is declared external
# here so Compose attaches to it rather than making a second, isolated one.

# One image, built once, run six ways. Anchored rather than repeated: the web
# and API service definitions used to carry two copies of the same forty-line
# environment block, which is exactly how the two come to disagree about which
# chain they are on.
x-image: &image
  # Built here, on this host.
  #
  # Every service shares one image *name*, so Compose builds it once and the
  # other eight reuse the result rather than each running the same build.
  #
  # This used to pull a prebuilt image instead of building one, because a release
  # otherwise spends four to six minutes compiling two browser bundles on the
  # box that is meant to be serving traffic. That cost is back, deliberately, and
  # it is the price of having no registry in the loop. `docker-compose.cache.yml`
  # plus a `docker-container` builder keeps the install and bundle layers out of
  # the daemon's prunable cache and takes the edge off; nothing makes a source
  # change free, because the build stage opens with `COPY . .` and both bundles
  # rebuild whatever is cached.
  #
  # `IMAGE_TAG` no longer expresses a rollback — there is no published history to
  # roll back to. It names the local tag, and a rollback is now `git checkout`
  # of the commit you want plus a rebuild.
  image: lemon-markets:${IMAGE_TAG:-local}
  build:
    context: .
    target: release
    # The `VITE_` values are build inputs, not runtime configuration. They are
    # compiled into the browser bundle rather than read at runtime, so they
    # belong here and not under `environment`, and changing one is a rebuild
    # rather than a restart.
    #
    # They used to be GitHub repository variables, read by the workflow that
    # published the image. With no CI in the path they come from the host
    # environment instead — Dokploy's Environment tab, or the `.env` beside this
    # file. A factory address is what makes a chain appear in the network
    # switcher at all, so leaving these unset ships a working app with an empty
    # switcher: wrong in the one way a user finds before an operator does.
    args:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
      VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-}
      VITE_BASE_RPC_URL: ${VITE_BASE_RPC_URL:-}
      VITE_CHAIN_RPC_URL: ${VITE_CHAIN_RPC_URL:-}
      VITE_VAULT_FACTORY_ADDRESS: ${VITE_VAULT_FACTORY_ADDRESS:-}
      VITE_VAULT_FACTORY_ADDRESS_BASE: ${VITE_VAULT_FACTORY_ADDRESS_BASE:-}
      VITE_VAULT_FACTORY_ADDRESS_ARBITRUM: ${VITE_VAULT_FACTORY_ADDRESS_ARBITRUM:-}
      VITE_VAULT_FACTORY_ADDRESS_XLAYER: ${VITE_VAULT_FACTORY_ADDRESS_XLAYER:-}
      VITE_RPC_URL_BASE: ${VITE_RPC_URL_BASE:-}
      VITE_RPC_URL_ARBITRUM: ${VITE_RPC_URL_ARBITRUM:-}
      VITE_RPC_URL_XLAYER: ${VITE_RPC_URL_XLAYER:-}

x-database: &database
  DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lemon}

# Everything the server side reads. Shared by web, api, admin and the agent so
# they cannot drift apart about which chain, which venue, or which factory.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lemon}

  # Chain. Base mainnet is pinned in code on both sides; only the endpoints are a
  # deployment choice, and the browser's copy is the build arg above.
  BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
  # Comma separated. The API falls back through these; the indexer spreads its
  # backfill across them. Passed to every service so one setting covers all of
  # them — until now it could be set in .env and reached nothing.
  BASE_RPC_FALLBACK_URLS: ${BASE_RPC_FALLBACK_URLS:-}
  BASE_RPC_BATCH: ${BASE_RPC_BATCH:-}

  # Deployed contracts. Without the factory the admin console can read the
  # market board but cannot create a vault, and says so rather than failing at
  # signing time.
  VAULT_FACTORY_ADDRESS: ${VAULT_FACTORY_ADDRESS:-}
  INSURANCE_FUND_ADDRESS: ${INSURANCE_FUND_ADDRESS:-}
  USDC_ADDRESS: ${USDC_ADDRESS:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}

  # Per chain. A factory address is what enables a chain: one that has none is
  # not indexed, not offered in the app, and not something a vault can be made
  # on. The unsuffixed names above still work and still mean Base.
  VAULT_FACTORY_ADDRESS_BASE: ${VAULT_FACTORY_ADDRESS_BASE:-}
  VAULT_FACTORY_ADDRESS_ARBITRUM: ${VAULT_FACTORY_ADDRESS_ARBITRUM:-}
  VAULT_FACTORY_ADDRESS_XLAYER: ${VAULT_FACTORY_ADDRESS_XLAYER:-}
  INSURANCE_FUND_ADDRESS_BASE: ${INSURANCE_FUND_ADDRESS_BASE:-}
  INSURANCE_FUND_ADDRESS_ARBITRUM: ${INSURANCE_FUND_ADDRESS_ARBITRUM:-}
  INSURANCE_FUND_ADDRESS_XLAYER: ${INSURANCE_FUND_ADDRESS_XLAYER:-}
  USDC_ADDRESS_BASE: ${USDC_ADDRESS_BASE:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
  USDC_ADDRESS_ARBITRUM: ${USDC_ADDRESS_ARBITRUM:-0xaf88d065e77c8cC2239327C5EDb3A432268e5831}
  USDC_ADDRESS_XLAYER: ${USDC_ADDRESS_XLAYER:-0xB6CEceAB302E2E4948951eE7843FC24E92933061}

  # Per-chain endpoints. Nothing falls through to another chain's value: a chain
  # reading another's node would index a chain with no factory on it and serve an
  # empty app, which looks like "no vaults yet" rather than like a misconfiguration.
  RPC_URL_BASE: ${RPC_URL_BASE:-}
  RPC_URL_ARBITRUM: ${RPC_URL_ARBITRUM:-}
  RPC_URL_XLAYER: ${RPC_URL_XLAYER:-}
  ARBITRUM_RPC_FALLBACK_URLS: ${ARBITRUM_RPC_FALLBACK_URLS:-}
  XLAYER_RPC_FALLBACK_URLS: ${XLAYER_RPC_FALLBACK_URLS:-}
  RPC_BATCH: ${RPC_BATCH:-}

  # The read model. Reached over the private network; the browser never talks to
  # it directly, the API proxies it.
  INDEXER_URL: http://indexer:42069

  # Venues. Spot is KyberSwap on Base, the perp is Pacifica on Solana
  # mainnet-beta, and Relay carries USDC between the two.
  KYBER_BASE_URL: ${KYBER_BASE_URL:-https://aggregator-api.kyberswap.com}
  KYBER_CLIENT_ID: ${KYBER_CLIENT_ID:-lemon-markets}
  # LI.FI. Unused by the three chains in this build — X Layer reads its
  # Uniswap V3 pools directly — and kept for a fourth.
  LIFI_BASE_URL: ${LIFI_BASE_URL:-https://li.quest}
  LIFI_INTEGRATOR: ${LIFI_INTEGRATOR:-lemon-markets}
  LIFI_API_KEY: ${LIFI_API_KEY:-}
  PACIFICA_API_URL: ${PACIFICA_API_URL:-https://api.pacifica.fi/api/v1}
  SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
  RELAY_API_URL: ${RELAY_API_URL:-https://api.relay.link}
  # Required for the agent, which bridges every trade's margin over Relay
  # deposit addresses; without it the agent refuses to start. For the API it is
  # softer — user deposits stay disabled, with an explanatory message.
  RELAY_API_KEY: ${RELAY_API_KEY:-}

  # Sign-in, and the admin allowlist this seeds at boot. Membership lives in the
  # database afterwards, so removing an address here does not revoke it.
  AUTH_SECRET: ${AUTH_SECRET:-}
  ADMIN_ADDRESSES: ${ADMIN_ADDRESSES:-}

  # NEAR chain signatures, which hold every vault agent's wallets.
  #
  # NEAR_ACCOUNT_ID is an input to address derivation, and a vault's agent
  # address is immutable — changing it after vaults exist leaves them permanently
  # unable to trade. Choose it once and treat it as permanent.
  NEAR_ACCOUNT_ID: ${NEAR_ACCOUNT_ID:-}
  NEAR_PRIVATE_KEY: ${NEAR_PRIVATE_KEY:-}
  NEAR_RPC_URL: ${NEAR_RPC_URL:-}
  NEAR_MPC_CONTRACT_ID: ${NEAR_MPC_CONTRACT_ID:-}

  # An agent's derived Solana wallet holds USDC and no SOL, so it cannot pay for
  # its own transactions. This covers those, and the one-off rent for a token
  # account, on every Pacifica deposit and every bridge home. It is never an
  # authority over vault funds — but keep it funded, because an empty fee payer
  # stalls an unwind that has already closed both legs.
  SOLANA_FEE_PAYER_SECRET: ${SOLANA_FEE_PAYER_SECRET:-}

  # Logging, for every service. `info` is one line per API request and a running
  # commentary of each agent cycle; `debug` adds the per-step detail inside a
  # tick and every request as it arrives. `LOG_FORMAT=json` emits one JSON
  # object per line for a log shipper.
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-}

  # Fees this deployment collects. Spot rides inside the KyberSwap route, so it
  # comes out of vault performance and is disclosed on the vault page.
  SPOT_FEE_BPS: ${SPOT_FEE_BPS:-}
  SPOT_FEE_RECEIVER: ${SPOT_FEE_RECEIVER:-}
  SPOT_FEE_CHARGE_BY: ${SPOT_FEE_CHARGE_BY:-}

x-restart: &restart
  restart: unless-stopped

# The agent, minus the one thing that differs between its containers.
#
# Extracted because there is one per chain and they must not drift: a second
# agent that missed a timeout change, or came up before the indexer was healthy,
# would trade a different policy against a half-synced redemption queue.
x-agent-service: &agent-service
  working_dir: /usr/src/app
  command: ["bun", "run", "apps/agent/src/index.ts"]
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    # Healthy, not started: the agent reports NAV and fulfils redemptions from
    # what the indexer tells it. Acting on a half-synced queue would mean
    # fulfilling against a partial view of who is owed what.
    indexer:
      condition: service_healthy
    web:
      condition: service_healthy
  networks:
    - internal

# Everything an agent reads that the other services do not. Chain-independent:
# the chain is AGENT_CHAIN_ID on each container, and nothing else here changes
# with it.
x-agent-env: &agent-env
  # The vault list comes from the API, not the indexer: a vault's derivation
  # path and venue configuration are deliberately off-chain, and the raw
  # index would hand the agent vaults it has no way to act on.
  AGENT_API_URL: http://web:3002/api
  # How long a crossing may take before a tick gives up on it. Giving up
  # does not cancel anything: the transfer stays recorded as in flight and
  # keeps counting towards NAV.
  BRIDGE_FILL_TIMEOUT_MS: ${BRIDGE_FILL_TIMEOUT_MS:-1200000}
  VENUE_WITHDRAWAL_TIMEOUT_MS: ${VENUE_WITHDRAWAL_TIMEOUT_MS:-900000}
  # Each tick reads both venues and may report a valuation, so this
  # interacts with the vault's own minNavReportInterval.
  AGENT_TICK_INTERVAL_MS: ${AGENT_TICK_INTERVAL_MS:-60000}
  # The smallest spot leg worth opening, in dollars. Measured on the leg
  # rather than on the deployment that funds it, so at 1x a vault needs
  # roughly twice this idle before it can deploy at all.
  MIN_DEPLOY_USDC: ${MIN_DEPLOY_USDC:-30}
  # How far below its ceiling a hedge is opened, in basis points. Reported
  # leverage is marked to market on both sides, so a hedge sized at exactly
  # its ceiling breaches on a fraction of a percent — and a conservative
  # vault has no headroom of its own to drift into. 300 bps covers a 1.55%
  # move, at the cost of that much less spot leg per dollar deployed.
  MARGIN_BUFFER_BPS: ${MARGIN_BUFFER_BPS:-300}
  # The smallest margin top-up worth bridging, in dollars. Restoring the
  # buffer is often a matter of cents, and bridging cents costs more than
  # the vault earns. Worth lowering for a small vault.
  MIN_TOP_UP_USDC: ${MIN_TOP_UP_USDC:-5}
  # Optional. With no key the agent runs on its deterministic policy alone,
  # which is strictly less clever and equally safe.
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
  OPENROUTER_REFERER: ${OPENROUTER_REFERER:-}

services:
  postgres:
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password in Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:-lemon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      # Nothing must start migrating before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemon} -d ${POSTGRES_DB:-lemon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: pushes the schema, then exits. Everything else waits for it to
  # complete successfully, so a failed migration blocks the release instead of
  # letting a half-migrated schema serve traffic.
  #
  # `db push`, not `migrate deploy`: this schema has no migration history, and
  # `migrate deploy` fails outright against a database it did not create.
  #
  # Two steps, because push will not make every change. It refuses a primary-key
  # swap without `--accept-data-loss`, so a deployment onto a database that
  # predates multi-chain failed here and stayed failed. `db-migrate.ts` applies
  # that one reviewed migration when — and only when — the database still needs
  # it, then push handles everything additive as before.
  #
  # Deliberately not `--accept-data-loss` on push. That would not answer the
  # question once; it would hand it to push permanently, for every future schema
  # change, on a database holding custody records.
  migrate:
    <<: *image
    working_dir: /usr/src/app
    command:
      - sh
      - -c
      - >-
        bun run scripts/db-migrate.ts &&
        bunx prisma db push --schema packages/db/prisma/schema.prisma --skip-generate
    environment:
      <<: *database
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # The read model, rebuilt from chain events. Disposable: drop it and a resync
  # reproduces it exactly.
  #
  # Its own `ponder` schema, deliberately. Left at the default it writes into
  # `public` alongside Prisma, and the migrate step above then offers to drop
  # `vault`, `nav_point`, `activity` and the rest of it.
  #
  # PORT is set explicitly because Ponder resolves its listen port from `PORT`
  # in preference to its own `--port` flag.
  #
  # Started through `scripts/start.ts` rather than `ponder start` directly. Any
  # deploy that changes how the read model is derived changes Ponder's build id,
  # and Ponder refuses to start against a schema stamped with a different one —
  # which, under `restart: unless-stopped`, is an indexer that crash-loops until
  # someone drops the schema by hand while the board serves empty. The wrapper
  # drops it and reindexes; see the script for why that is safe here.
  indexer:
    <<: [*image, *restart]
    working_dir: /usr/src/app/apps/indexer
    command: ["bun", "run", "start"]
    environment:
      <<: *app-env
      PORT: 42069
      # Comma separated, and worth setting to more than one endpoint: Ponder
      # measures each one's rate limit and splits the backfill between them,
      # where a single public node is throttled within seconds and then warns
      # that no provider is available until someone reads the logs.
      PONDER_RPC_URL_BASE: ${PONDER_RPC_URL_BASE:-}
      PONDER_RPC_URL_ARBITRUM: ${PONDER_RPC_URL_ARBITRUM:-}
      PONDER_RPC_URL_XLAYER: ${PONDER_RPC_URL_XLAYER:-}
      # Indexing from genesis is hours of RPC for nothing — there is no factory
      # before the block it was deployed in. One per chain, because the chains
      # were not deployed to at the same time and are not at the same height.
      VAULT_FACTORY_START_BLOCK: ${VAULT_FACTORY_START_BLOCK:-0}
      VAULT_FACTORY_START_BLOCK_BASE: ${VAULT_FACTORY_START_BLOCK_BASE:-}
      VAULT_FACTORY_START_BLOCK_ARBITRUM: ${VAULT_FACTORY_START_BLOCK_ARBITRUM:-}
      VAULT_FACTORY_START_BLOCK_XLAYER: ${VAULT_FACTORY_START_BLOCK_XLAYER:-}
      # Block 0 is refused for a chain that has a factory; this is the opt-out,
      # and is only ever correct on a local chain.
      VAULT_FACTORY_ALLOW_GENESIS_SCAN: ${VAULT_FACTORY_ALLOW_GENESIS_SCAN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://localhost:42069/health'); process.exit(r.ok ? 0 : 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    <<: [*image, *restart]
    environment:
      <<: *app-env
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Started, not healthy: a backfill can take minutes and the app degrades
      # honestly while it runs — it says the indexer is unreachable rather than
      # showing an empty board. Blocking the release on a full resync would make
      # every deploy as slow as the longest backfill.
      indexer:
        condition: service_started
    networks:
      - internal
      - dokploy-network
    healthcheck:
      # fetch() resolves for a 404 as readily as a 200, so the status has to be
      # asserted — otherwise a container serving nothing but error pages is
      # reported healthy.
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://localhost:3002/api/health'); process.exit(r.ok ? 0 : 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      # Router names are namespaced so they cannot clash with another app's on
      # the shared Traefik instance.
      - traefik.http.routers.lemon-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.lemon-web.entrypoints=websecure
      - traefik.http.routers.lemon-web.tls=true
      - traefik.http.routers.lemon-web.tls.certresolver=letsencrypt
      - traefik.http.services.lemon-web.loadbalancer.server.port=3002
      # Traefik is attached to several networks; name the one to route over.
      - traefik.docker.network=dokploy-network
      # Plain HTTP is answered only to redirect it to HTTPS.
      - traefik.http.routers.lemon-web-insecure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.lemon-web-insecure.entrypoints=web
      - traefik.http.routers.lemon-web-insecure.middlewares=lemon-https
      - traefik.http.middlewares.lemon-https.redirectscheme.scheme=https
      - traefik.http.middlewares.lemon-https.redirectscheme.permanent=true

  # One-shot: writes the venue configuration for every vault the indexer knows
  # about, then exits. The sibling of `migrate` — that one gets the schema to
  # where the code expects it, this one gets the rows there.
  #
  # A vault carries an agent address and a market id on chain and nothing else:
  # `marketId` is a hash, so the ticker does not survive it, and neither does the
  # spot token, the perp symbol or the derivation path. Those live in Postgres.
  # The admin console's create-vault flow writes them; a vault deployed by script
  # has none, shows "No venue config", and its agent skips it. This backfills the
  # same rows that flow would have written.
  #
  # Runs on every deploy rather than once, because "once" is the wrong number:
  # deploy a vault and the row has to appear without an operator remembering to
  # SSH in. It upserts, so re-running is a no-op for vaults already configured.
  #
  # Nothing depends on it. Seeding is a repair, and a deployment whose vaults are
  # already configured must not be held back by it — if it fails, the app still
  # serves, and the failure is in this service's log rather than the release.
  seed:
    <<: *image
    working_dir: /usr/src/app
    command: ["bun", "run", "scripts/seed-venue-config.ts"]
    environment:
      <<: *app-env
      # Vault list and ticker resolution, not the raw index — the same endpoint
      # the agent reads, so the two agree about what a vault is.
      AGENT_API_URL: http://web:3002/api
    depends_on:
      # Healthy, not started: it calls the API on its first line. `web` being
      # healthy also means migrate has completed, so the tables exist.
      web:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # The operator console. Its own app on its own origin so it can sit behind a
  # VPN, an IP allowlist or an SSO proxy while the public app faces the
  # internet. It mounts the same API, so authorisation is decided in one place.
  #
  # Not optional: creating a vault happens nowhere else.
  admin:
    <<: [*image, *restart]
    working_dir: /usr/src/app/apps/admin
    command: ["bun", "./app/server.ts"]
    environment:
      <<: *app-env
      ADMIN_PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      indexer:
        condition: service_started
    networks:
      - internal
      - dokploy-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://localhost:3004/api/health'); process.exit(r.ok ? 0 : 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.lemon-admin.rule=Host(`${ADMIN_DOMAIN:-admin.${DOMAIN}}`)
      - traefik.http.routers.lemon-admin.entrypoints=websecure
      - traefik.http.routers.lemon-admin.tls=true
      - traefik.http.routers.lemon-admin.tls.certresolver=letsencrypt
      - traefik.http.services.lemon-admin.loadbalancer.server.port=3004
      - traefik.docker.network=dokploy-network

  # The per-vault worker: valuation, execution, the redemption queue.
  #
  # No ports and no ingress — it only makes outbound calls.
  #
  # It used to sit behind a Compose profile, which meant it was never created on
  # the host at all: no container in Dokploy, and so no log to read when a vault
  # was not being ticked. It deploys with everything else now, and is stopped
  # from the Dokploy UI when it should not be running.
  #
  # It trades for real: KyberSwap on Base, Pacifica on Solana, Relay in between.
  # It refuses to start without RELAY_API_KEY and SOLANA_FEE_PAYER_SECRET.
  agent:
    <<: [*image, *restart, *agent-service]
    environment:
      <<: [*app-env, *agent-env]
      # Pinned, not `${AGENT_CHAIN_ID:-8453}`.
      #
      # The variable is shared by everything Compose renders, so an
      # `AGENT_CHAIN_ID=196` left in `.env` — which is exactly what
      # `deploy-xlayer.sh` offers to write — would point THIS container at X
      # Layer too. Two processes would then tick the same vaults at once:
      # duplicate deployments, and two NAV reports racing each other. Each
      # container naming its own chain makes that unreachable.
      AGENT_CHAIN_ID: 8453
      # Its own NEAR access key, falling back to the shared one.
      #
      # Every signature is a NEAR transaction from one access key, and the
      # client serialises them *within a process* — a queue in memory, which two
      # containers cannot share. Two agents on one key race on the nonce and one
      # of the pair is rejected as a duplicate, which during an unwind is a leg
      # that did not close. A second access key on the SAME account fixes it:
      # nonces are per key, while derived wallet addresses come from the account
      # id and the path, so every vault's agent wallet is unchanged.
      NEAR_PRIVATE_KEY: ${NEAR_PRIVATE_KEY_BASE:-${NEAR_PRIVATE_KEY:-}}

  # The same worker, on X Layer.
  #
  # A second container rather than a second value, because one agent process
  # serves exactly one chain: the wallet client signs with its id, the USDC it
  # moves is that chain's, and the vault it reports NAV to lives there. A
  # process reading an X Layer vault's balances against Base would not revert —
  # it would read zero, and report a NAV of zero to a funded vault, which wipes
  # out every holder's share price.
  #
  # Deployed with everything else rather than behind a profile, for the reason
  # written above the Base agent: a profiled service is never created on the
  # host at all, so it shows up nowhere in Dokploy and there is no log to read
  # when a vault is not being ticked. This repo has made that mistake once.
  #
  # The cost of it running before X Layer has a factory is that it ticks and
  # finds nothing. The cost of it being invisible is a chain that silently never
  # trades, which is worse and much harder to notice.
  agent-xlayer:
    <<: [*image, *restart, *agent-service]
    environment:
      <<: [*app-env, *agent-env]
      AGENT_CHAIN_ID: 196
      NEAR_PRIVATE_KEY: ${NEAR_PRIVATE_KEY_XLAYER:-${NEAR_PRIVATE_KEY:-}}

  # The API as its own scalable unit, on its own origin.
  #
  # The web container also mounts the API in-process, so this is a second way in
  # rather than the only one — both read the same database and the same indexer.
  # It carried a `split` profile and so was never deployed, which made it
  # invisible in Dokploy and impossible to get a log out of.
  #
  # Its Traefik router answers on ${API_DOMAIN}, defaulting to api.${DOMAIN}. If
  # that name has no DNS record the router simply never matches, and the service
  # is still reachable inside the compose network as http://api:3003.
  api:
    <<: [*image, *restart]
    working_dir: /usr/src/app
    command: ["bun", "run", "apps/api/src/index.ts"]
    environment:
      <<: *app-env
      API_PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      indexer:
        condition: service_started
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.lemon-api.rule=Host(`${API_DOMAIN:-api.${DOMAIN}}`)
      - traefik.http.routers.lemon-api.entrypoints=websecure
      - traefik.http.routers.lemon-api.tls=true
      - traefik.http.routers.lemon-api.tls.certresolver=letsencrypt
      - traefik.http.services.lemon-api.loadbalancer.server.port=3003
      - traefik.docker.network=dokploy-network

networks:
  # Database, indexer and agent traffic never leaves this network.
  internal:
  # Created by Dokploy at install time; Traefik lives here.
  dokploy-network:
    external: true

volumes:
  postgres-data:
