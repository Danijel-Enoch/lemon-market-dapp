name: Build and Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect Dockerfile
        run: |
          echo "Dockerfile path: ./dockerfile"
          ls -l ./dockerfile || true

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/elcharitas/lemon-markets:latest
            ghcr.io/elcharitas/lemon-markets:${{ github.sha }}
            ghcr.io/elcharitas/lemon-markets:${{ github.ref_name }}

      - name: Output image references
        run: |
          echo "Pushed image tags:"
          echo "ghcr.io/elcharitas/lemon-markets:latest"
          echo "ghcr.io/elcharitas/lemon-markets:${{ github.sha }}"
          echo "ghcr.io/elcharitas/lemon-markets:${{ github.ref_name }}"
