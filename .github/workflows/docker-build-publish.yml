name: Build and publish the image

# Build once here, pull it on the host.
#
# Dokploy used to build the image itself on every release — four to six minutes
# of the deploy spent compiling two browser bundles on the box that is meant to
# be serving traffic. The image is the same every time, so it is built here and
# the host does nothing but pull it.
#
# The `VITE_` values below are the reason this is not a generic image. They are
# compiled into the browser bundle rather than read at runtime — a factory
# address is what makes a chain appear in the network switcher at all — so the
# image is specific to the deployment whose values it was built with. A second
# environment needs its own tag, built from its own variables.

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR rejects an uppercase path, and the owner here is not lowercase.
  IMAGE: ghcr.io/danijel-enoch/lemon-market-dapp

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only from the branch that is actually deployed, so a push to
      # another branch cannot quietly become what the next `docker compose pull`
      # picks up. Every build is also tagged with its commit, which is what a
      # rollback pins to.
      - name: Work out the tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "${IMAGE}:${GITHUB_REF_NAME//\//-}"
            if [ "${GITHUB_REF_NAME}" = "dev" ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Capital D. The file is `Dockerfile`, this runner is case-sensitive,
          # and the previous `./dockerfile` could never have resolved.
          file: ./Dockerfile
          target: release
          push: true
          # One architecture, deliberately. The host is amd64, and building arm64
          # under QEMU as well doubled the job for an image nothing pulls.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          # Layers survive between runs, so an unchanged lockfile means no
          # reinstall and unchanged sources mean no rebundle.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
            VITE_WALLETCONNECT_PROJECT_ID=${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
            VITE_PUBLIC_APP_URL=${{ vars.VITE_PUBLIC_APP_URL }}
            VITE_VAULT_FACTORY_ADDRESS=${{ vars.VITE_VAULT_FACTORY_ADDRESS }}
            VITE_VAULT_FACTORY_ADDRESS_BASE=${{ vars.VITE_VAULT_FACTORY_ADDRESS_BASE }}
            VITE_VAULT_FACTORY_ADDRESS_ARBITRUM=${{ vars.VITE_VAULT_FACTORY_ADDRESS_ARBITRUM }}
            VITE_VAULT_FACTORY_ADDRESS_XLAYER=${{ vars.VITE_VAULT_FACTORY_ADDRESS_XLAYER }}
            VITE_RPC_URL_BASE=${{ vars.VITE_RPC_URL_BASE }}
            VITE_RPC_URL_ARBITRUM=${{ vars.VITE_RPC_URL_ARBITRUM }}
            VITE_RPC_URL_XLAYER=${{ vars.VITE_RPC_URL_XLAYER }}
            VITE_BASE_RPC_URL=${{ vars.VITE_BASE_RPC_URL }}
            VITE_CHAIN_RPC_URL=${{ vars.VITE_CHAIN_RPC_URL }}

      # A bundle built without a factory address is not a broken build — it is a
      # working app with an empty network switcher, which is discovered by a user
      # rather than by CI. So it is checked here, where it is still cheap.
      - name: Check the bundle has a chain in it
        run: |
          if [ -z "${{ vars.VITE_VAULT_FACTORY_ADDRESS_BASE }}${{ vars.VITE_VAULT_FACTORY_ADDRESS }}" ]; then
            echo "::error::No VITE_VAULT_FACTORY_ADDRESS_* repository variable is set."
            echo "::error::The image will ship with no chains in the network switcher."
            echo "::error::Set them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Where it went
        run: |
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "On the host: \`docker compose pull && docker compose up -d\`" >> "$GITHUB_STEP_SUMMARY"
