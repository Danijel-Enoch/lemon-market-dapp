# Full stack: Postgres, the API, and the web app.
#
# The web container mounts the API in-process, so `web` alone is a complete
# deployment. The standalone `api` service is included for running it on its own
# host (or scaling it separately) — enable it with the `split` profile:
#
#   docker compose up                    # postgres + web (API embedded)
#   docker compose --profile split up    # postgres + web + standalone API

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lemon}
      POSTGRES_DB: ${POSTGRES_DB:-lemon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # The app must not start migrating before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemon} -d ${POSTGRES_DB:-lemon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: release
    # The image's WORKDIR is apps/web; db:deploy is a root workspace script.
    working_dir: /usr/src/app
    command: ["bun", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD:-lemon}@postgres:5432/${POSTGRES_DB:-lemon}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: release
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD:-lemon}@postgres:5432/${POSTGRES_DB:-lemon}
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      KYBER_BASE_URL: ${KYBER_BASE_URL:-https://aggregator-api.kyberswap.com}
      KYBER_CLIENT_ID: ${KYBER_CLIENT_ID:-lemon-markets}
      PACIFICA_API_URL: ${PACIFICA_API_URL:-https://api.pacifica.fi/api/v1}
      RELAY_API_URL: ${RELAY_API_URL:-https://api.relay.link}
      # Deposits stay disabled (with an explanatory message) until this is set.
      RELAY_API_KEY: ${RELAY_API_KEY:-}

      # Accounts: sign-in, derived wallets, Pacifica trading. All three are
      # required together — without them the app still serves market data and
      # the connected-wallet view, and /api/auth/status names what is missing.
      #
      # NEAR_ACCOUNT_ID is an input to address derivation. Changing it after
      # users exist repoints every one of them at fresh, empty wallets.
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEAR_ACCOUNT_ID: ${NEAR_ACCOUNT_ID:-}
      NEAR_PRIVATE_KEY: ${NEAR_PRIVATE_KEY:-}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-}
      NEAR_MPC_CONTRACT_ID: ${NEAR_MPC_CONTRACT_ID:-}

      # Crediting a deposit is signed by the user's derived Solana wallet, which
      # holds USDC and no SOL, so a funded fee payer is needed to cover it.
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_FEE_PAYER_SECRET: ${SOLANA_FEE_PAYER_SECRET:-}

      # Fees. Spot rides inside the KyberSwap route; the Pacifica builder code
      # is approved by each user during onboarding.
      SPOT_FEE_BPS: ${SPOT_FEE_BPS:-}
      SPOT_FEE_RECEIVER: ${SPOT_FEE_RECEIVER:-}
      SPOT_FEE_CHARGE_BY: ${SPOT_FEE_CHARGE_BY:-}
      PACIFICA_BUILDER_CODE: ${PACIFICA_BUILDER_CODE:-}
      PACIFICA_BUILDER_MAX_FEE_RATE: ${PACIFICA_BUILDER_MAX_FEE_RATE:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # fetch() resolves for a 404 as readily as a 200, so the status has to be
      # asserted — otherwise a container serving nothing but error pages is
      # reported healthy.
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://localhost:3002/api/health'); process.exit(r.ok ? 0 : 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    profiles: ["split"]
    build:
      context: .
      target: release
    working_dir: /usr/src/app
    command: ["bun", "run", "apps/api/src/index.ts"]
    restart: unless-stopped
    ports:
      - "${API_PORT:-3003}:3003"
    environment:
      NODE_ENV: production
      API_PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-lemon}:${POSTGRES_PASSWORD:-lemon}@postgres:5432/${POSTGRES_DB:-lemon}
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      KYBER_CLIENT_ID: ${KYBER_CLIENT_ID:-lemon-markets}
      PACIFICA_API_URL: ${PACIFICA_API_URL:-https://api.pacifica.fi/api/v1}
      RELAY_API_URL: ${RELAY_API_URL:-https://api.relay.link}
      # Deposits stay disabled (with an explanatory message) until this is set.
      RELAY_API_KEY: ${RELAY_API_KEY:-}

      # Accounts: sign-in, derived wallets, Pacifica trading. All three are
      # required together — without them the app still serves market data and
      # the connected-wallet view, and /api/auth/status names what is missing.
      #
      # NEAR_ACCOUNT_ID is an input to address derivation. Changing it after
      # users exist repoints every one of them at fresh, empty wallets.
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEAR_ACCOUNT_ID: ${NEAR_ACCOUNT_ID:-}
      NEAR_PRIVATE_KEY: ${NEAR_PRIVATE_KEY:-}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-}
      NEAR_MPC_CONTRACT_ID: ${NEAR_MPC_CONTRACT_ID:-}

      # Crediting a deposit is signed by the user's derived Solana wallet, which
      # holds USDC and no SOL, so a funded fee payer is needed to cover it.
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      SOLANA_FEE_PAYER_SECRET: ${SOLANA_FEE_PAYER_SECRET:-}

      # Fees. Spot rides inside the KyberSwap route; the Pacifica builder code
      # is approved by each user during onboarding.
      SPOT_FEE_BPS: ${SPOT_FEE_BPS:-}
      SPOT_FEE_RECEIVER: ${SPOT_FEE_RECEIVER:-}
      SPOT_FEE_CHARGE_BY: ${SPOT_FEE_CHARGE_BY:-}
      PACIFICA_BUILDER_CODE: ${PACIFICA_BUILDER_CODE:-}
      PACIFICA_BUILDER_MAX_FEE_RATE: ${PACIFICA_BUILDER_MAX_FEE_RATE:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
